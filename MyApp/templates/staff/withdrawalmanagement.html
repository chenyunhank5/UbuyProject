<!-- FULL WITHDRAWAL REQUEST TABLE (BANK + WALLET SUPPORT) -->

<div class="space-y-6"
     x-data="{
        filter: 'Pending',
        search: '',
        withdrawals: [],
        loading: true,
        page: 1,
        totalPages: 1,
        hasNext: false,
        hasPrev: false,

        async fetchWithdrawals() {
            this.loading = true;
            try {
                const res = await fetch(`/api/admin/withdrawals/?page=${this.page}&q=${this.search}&status=${this.filter}`);
                const data = await res.json();

                this.withdrawals = data.withdrawals || [];
                this.totalPages = data.total_pages || 1;
                this.hasNext = data.has_next || false;
                this.hasPrev = data.has_previous || false;
            } catch (e) {
                console.error('Withdrawal fetch error', e);
            }
            this.loading = false;
        },

        nextPage() {
            if (this.hasNext) {
                this.page++;
                this.fetchWithdrawals();
            }
        },

        prevPage() {
            if (this.hasPrev) {
                this.page--;
                this.fetchWithdrawals();
            }
        },

        isWallet(method) {
            return [
                'tigo_money',
                'yape',
                'yasta',
                'altoke'
            ].includes((method || '').toLowerCase());
        },

        methodLabel(method) {
            const labels = {
                bank_transfer: 'Bank Transfer',
                tigo_money: 'Tigo Money',
                yape: 'Yape',
                yasta: 'Yasta',
                altoke: 'Altoke'
            };
            return labels[method] || method || '-';
        }
     }"
     x-init="
        fetchWithdrawals();
        $watch('search', () => {
            page = 1;
            fetchWithdrawals();
        });
        $watch('filter', () => {
            page = 1;
            fetchWithdrawals();
        });
     ">

    <!-- HEADER -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
            <h2 class="text-2xl font-black dark:text-white tracking-tight">
                Withdrawal Requests
            </h2>
            <p class="text-slate-500 dark:text-slate-400 text-xs font-medium">
                Review and process withdrawal requests.
            </p>
        </div>

        <div class="flex flex-col md:flex-row items-center gap-3">

            <!-- SEARCH -->
            <div class="relative w-full md:w-64">
                <input
                    type="text"
                    x-model.debounce.500ms="search"
                    placeholder="Search username..."
                    class="w-full bg-slate-100 dark:bg-slate-900 border-none rounded-2xl px-4 py-2 text-xs font-bold dark:text-white focus:ring-2 focus:ring-blue-500 transition-all">
            </div>

            <!-- FILTER -->
            <div class="flex bg-slate-100 dark:bg-slate-900/50 p-1 rounded-2xl border border-slate-200/50 dark:border-slate-800">

                <button
                    @click="filter = 'Pending'"
                    :class="filter === 'Pending'
                        ? 'bg-white dark:bg-slate-800 shadow-sm text-blue-600'
                        : 'text-slate-500'"
                    class="px-6 py-2 text-[10px] font-black uppercase rounded-xl transition-all">
                    Pending
                </button>

                <button
                    @click="filter = 'All'"
                    :class="filter === 'All'
                        ? 'bg-white dark:bg-slate-800 shadow-sm text-blue-600'
                        : 'text-slate-500'"
                    class="px-6 py-2 text-[10px] font-black uppercase rounded-xl transition-all">
                    History
                </button>

            </div>
        </div>
    </div>

    <!-- TABLE -->
    <div class="bg-white dark:bg-slate-950 rounded-[2rem] border border-slate-200 dark:border-slate-800 overflow-hidden shadow-sm">

        <div class="overflow-x-auto">
            <table class="w-full text-left">

                <!-- HEAD -->
                <thead>
                    <tr class="bg-slate-50 dark:bg-slate-900 border-b border-slate-100 dark:border-slate-800">

                        <th class="px-6 py-5 text-[10px] font-black uppercase text-slate-400">
                            User
                        </th>

                        <th class="px-6 py-5 text-[10px] font-black uppercase text-slate-400">
                            Payment Details
                        </th>

                        <th class="px-6 py-5 text-[10px] font-black uppercase text-slate-400">
                            Amount
                        </th>

                        <th class="px-6 py-5 text-[10px] font-black uppercase text-slate-400">
                            Status
                        </th>

                        <th class="px-6 py-5 text-right text-[10px] font-black uppercase text-slate-400">
                            Action
                        </th>

                    </tr>
                </thead>

                <!-- BODY -->
                <tbody class="divide-y divide-slate-100 dark:divide-slate-800">

                    <template x-for="w in withdrawals" :key="w.id">
                        <tr class="hover:bg-blue-50/30 dark:hover:bg-blue-900/5 transition-colors">

                            <!-- USER -->
                            <td class="px-6 py-4">
                                <div class="flex items-center gap-3">

                                    <div class="w-10 h-10 rounded-2xl bg-blue-600 text-white flex items-center justify-center font-black"
                                         x-text="w.username?.substring(0,1)?.toUpperCase() || 'U'">
                                    </div>

                                    <div>
                                        <p class="text-sm font-black dark:text-white"
                                           x-text="w.username">
                                        </p>

                                        <p class="text-[9px] font-bold text-slate-400 uppercase mt-1"
                                           x-text="w.created_at">
                                        </p>
                                    </div>

                                </div>
                            </td>

                            <!-- BANK / WALLET DETAILS -->
                            <td class="px-6 py-4">

                                <div class="space-y-1">

                                    <!-- METHOD -->
                                    <p class="text-[10px] font-black uppercase">
                                        Method:
                                        <span class="text-blue-600"
                                              x-text="methodLabel(w.bank_info.method)">
                                        </span>
                                    </p>

                                    <!-- WALLET -->
                                    <template x-if="isWallet(w.bank_info.method)">
                                        <div class="space-y-1">

                                            <p class="text-[10px] font-black uppercase">
                                                Wallet:
                                                <span class="text-slate-700 dark:text-slate-300"
                                                      x-text="methodLabel(w.bank_info.method)">
                                                </span>
                                            </p>

                                            <p class="text-[10px] font-black uppercase">
                                                Name:
                                                <span x-text="w.bank_info.name || '-'"></span>
                                            </p>

                                            <p class="text-[10px] font-black uppercase">
                                                Phone:
                                                <span x-text="w.bank_info.phone || '-'"></span>
                                            </p>

                                        </div>
                                    </template>

                                    <!-- BANK -->
                                    <template x-if="!isWallet(w.bank_info.method)">
                                        <div class="space-y-1">

                                            <p class="text-[10px] font-black uppercase">
                                                Bank:
                                                <span x-text="w.bank_info.bank || '-'"></span>
                                            </p>

                                            <p class="text-[10px] font-black uppercase">
                                                Name:
                                                <span x-text="w.bank_info.name || '-'"></span>
                                            </p>

                                            <p class="text-[10px] font-black uppercase">
                                                Account:
                                                <span x-text="w.bank_info.number || '-'"></span>
                                            </p>

                                            <p class="text-[10px] font-black uppercase">
                                                Phone:
                                                <span x-text="w.bank_info.phone || '-'"></span>
                                            </p>

                                        </div>
                                    </template>

                                </div>

                            </td>

                            <!-- AMOUNT -->
                            <td class="px-6 py-4">
                                <span class="text-sm font-mono font-black text-rose-500"
                                      x-text="'BOB ' + w.amount">
                                </span>
                            </td>

                            <!-- STATUS -->
                            <td class="px-6 py-4">

                                <span
                                    class="px-3 py-1 rounded-lg text-[9px] font-black uppercase"
                                    :class="{
                                        'bg-amber-100 text-amber-600': w.status === 'Pending',
                                        'bg-emerald-100 text-emerald-600': w.status === 'Approved',
                                        'bg-rose-100 text-rose-600': w.status === 'Rejected'
                                    }"
                                    x-text="w.status">
                                </span>

                            </td>

                            <!-- ACTION -->
                            <td class="px-6 py-4 text-right">

                                <template x-if="w.status === 'Pending'">
                                    <div class="flex justify-end gap-2">

                                        <a
                                            :href="'/staff/withdraw/action/' + w.id + '/reject/'"
                                            class="px-4 h-9 flex items-center rounded-xl bg-slate-100 hover:bg-rose-500 hover:text-white text-xs font-black transition-all">
                                            Reject
                                        </a>

                                        <a
                                            :href="'/staff/withdraw/action/' + w.id + '/approve/'"
                                            class="px-4 h-9 flex items-center rounded-xl bg-blue-600 text-white text-xs font-black hover:bg-blue-700 transition-all">
                                            Complete
                                        </a>

                                    </div>
                                </template>

                                <template x-if="w.status !== 'Pending'">
                                    <span class="text-[10px] font-black text-slate-400 uppercase">
                                        Handled
                                    </span>
                                </template>

                            </td>

                        </tr>
                    </template>

                    <!-- EMPTY -->
                    <template x-if="withdrawals.length === 0 && !loading">
                        <tr>
                            <td colspan="5" class="px-6 py-20 text-center">
                                <p class="text-slate-400 text-[10px] font-black uppercase">
                                    No withdrawal requests
                                </p>
                            </td>
                        </tr>
                    </template>

                </tbody>
            </table>
        </div>

        <!-- PAGINATION -->
        <div class="border-t border-slate-100 dark:border-slate-800 px-6 py-4 flex items-center justify-between">

            <span class="text-[10px] font-black text-slate-400 uppercase">
                Page
                <span class="text-blue-600" x-text="page"></span>
                /
                <span x-text="totalPages"></span>
            </span>

            <div class="flex gap-2">

                <button
                    @click="prevPage()"
                    :disabled="!hasPrev"
                    class="px-4 py-2 rounded-xl border text-[10px] font-black uppercase">
                    Previous
                </button>

                <button
                    @click="nextPage()"
                    :disabled="!hasNext"
                    class="px-4 py-2 rounded-xl border text-[10px] font-black uppercase">
                    Next
                </button>

            </div>
        </div>

    </div>
</div>
